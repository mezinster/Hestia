# Miroir à sens unique GitHub → Codeberg (codeberg.org/mezinster/Hestia) : branches et tags, avec
# suppression de ce qui n'existe plus ici. La clé d'écriture Codeberg est dans l'environnement
# codeberg-mirror, limité à fork/main : seul le code de fork/main y a accès. Les autres branches et
# les tags sont rattrapés par le planning (toutes les 6 h). Voir docs/fork/RELEASING.md § 4bis.
name: Codeberg mirror

on:
  push:
    branches: [fork/main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeberg-mirror
  cancel-in-progress: false

jobs:
  mirror:
    if: github.repository == 'mezinster/Hestia'
    runs-on: ubuntu-24.04
    environment: codeberg-mirror
    steps:
      - name: Clé SSH
        env:
          KEY: ${{ secrets.CODEBERG_MIRROR_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.CODEBERG_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          (umask 077; printf '%s\n' "$KEY" > ~/.ssh/codeberg)
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      # Clone nu : seulement refs/heads/* et refs/tags/* (pas les refs/pull/* de GitHub, que
      # Codeberg refuserait).
      - name: Miroir
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/codeberg -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
        run: |
          git clone --bare --quiet "https://github.com/${GITHUB_REPOSITORY}.git" repo.git
          git -C repo.git push --prune ssh://git@codeberg.org/mezinster/Hestia.git \
            '+refs/heads/*:refs/heads/*' '+refs/tags/*:refs/tags/*'
      - name: Nettoyage
        if: always()
        run: rm -f ~/.ssh/codeberg
