# Publication du fork (mezinster/Hestia) : sur un tag fork/<x.y.z>-fork.<N> poussé, ou à la main
# (workflow_dispatch) pour reconstruire un tag existant, en brouillon par défaut. Voir
# docs/fork/RELEASING.md. Les secrets de signature ne sont accessibles qu'à l'environnement
# fork-release, limité aux tags fork/* et à la branche fork/main (lancements manuels).
name: Publication du fork

on:
  push:
    tags: ['fork/*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag fork/<x.y.z>-fork.<N> existant
        required: true
      draft:
        description: Créer la Release en brouillon
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: fork-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    container: eclipse-temurin:17.0.20.1_1-jdk
    environment: fork-release
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      # git doit être présent avant le checkout, sinon actions/checkout télécharge une archive sans
      # historique et les notes de publication seraient fausses.
      - name: Outils
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends unzip git curl ca-certificates >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
      # actions/checkout remplace le tag annoté par un tag léger : on récupère les vrais tags pour
      # le résumé des notes (release-notes.sh lit le message du tag).
      - name: Tags annotés
        run: |
          git config --global --add safe.directory '*'
          git fetch --force --tags --quiet origin
      - name: Construction
        env:
          CI_COMMIT_TAG: ${{ env.TAG }}
          FORK_KEYSTORE_B64: ${{ secrets.FORK_KEYSTORE_B64 }}
          HESTIA_FORK_STORE_PASSWORD: ${{ secrets.FORK_STORE_PASSWORD }}
          HESTIA_FORK_KEY_ALIAS: ${{ secrets.FORK_KEY_ALIAS }}
          HESTIA_FORK_KEY_PASSWORD: ${{ secrets.FORK_KEY_PASSWORD }}
        run: scripts/fork/ci-build.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fork-release
          path: build/fork-release/
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      DRAFT: ${{ github.event_name == 'workflow_dispatch' && inputs.draft }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fork-release
          path: fork-release
      # Échoue si une Release existe déjà pour ce tag (jamais d'écrasement).
      - name: Release GitHub
        run: |
          args=()
          [[ "$DRAFT" == "true" ]] && args+=(--draft)
          gh release create "$TAG" fork-release/dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$(cat fork-release/title.txt)" --notes-file fork-release/notes.md "${args[@]}"
